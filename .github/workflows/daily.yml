name: Shun Japan Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1-5'
    - cron: '17 9,10 * * 1-5'
permissions:
  contents: read
  actions: read

concurrency:
  group: shun-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check today's data
        id: ready
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          import pandas as pd
          from shun import JQuants

          today = datetime.now(ZoneInfo("Asia/Tokyo")).date()
          date_text = today.isoformat()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"date={date_text}\n")
              output.write("ready=false\n")

          api = JQuants(1.5)
          calendar = api.get(
              "markets/calendar",
              **{
                  "from": (today - timedelta(days=40)).isoformat(),
                  "to": date_text,
              },
          )
          if calendar.empty:
              raise RuntimeError("取引カレンダーを取得できません。")

          sessions = sorted(
              calendar.loc[
                  calendar["HolDiv"].astype(str).isin(["1", "2"]),
                  "Date",
              ].astype(str).unique()
          )
          if date_text not in sessions:
              print(f"{date_text}: 株式市場の休業日。")
              raise SystemExit(0)
          if len(sessions) < 2:
              raise RuntimeError("前営業日を確認できません。")

          def valid_prices(frame, expected_date):
              required = {"Date", "Code", "C"}
              if frame.empty or not required.issubset(frame.columns):
                  return set()
              close = pd.to_numeric(frame["C"], errors="coerce")
              valid = (
                  frame["Date"].astype(str).eq(expected_date)
                  & close.gt(0)
                  & close.lt(float("inf"))
              )
              return set(frame.loc[valid, "Code"].astype(str))

          previous_date = sessions[-2]
          previous = api.get(
              "equities/bars/daily", date=previous_date
          )
          current = api.get(
              "equities/bars/daily", date=date_text
          )
          previous_codes = valid_prices(previous, previous_date)
          current_codes = valid_prices(current, date_text)

          if not previous_codes:
              raise RuntimeError("前営業日の株価を確認できません。")

          coverage = len(
              previous_codes & current_codes
          ) / len(previous_codes)
          print(f"前営業日の有効銘柄に対する取得率: {coverage:.2%}")

          if not current_codes:
              print("対象日の有効な終値がまだありません。")
              raise SystemExit(0)
          missing = sorted(previous_codes - current_codes)
          print(f"取得 {len(previous_codes & current_codes)}/{len(previous_codes)}。欠損コード: {','.join(missing)}")
          status = "暫定" if coverage < 0.99 else "通常"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"quality={status}（前営業日比 {coverage:.4%}）", file=output)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("ready=true\n")
          print(f"{date_text}: データ確認完了。分析を開始します。")
          PY

      - uses: actions/cache@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          path: cache
          key: shun-prices-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shun-prices-v1-

      - name: 上昇率ランキング
        id: ranking
        if: steps.ready.outputs.ready == 'true'
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          SCAN_DATE: ${{ steps.ready.outputs.date }}
          QUALITY: ${{ steps.ready.outputs.quality }}
        run: |
          python shun.py --date "$SCAN_DATE"
          echo "当日株価の取得状況：$QUALITY" >> "reports/$SCAN_DATE/analysis_input.md"

      - name: 相対強度
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          SCAN_DATE: ${{ steps.ready.outputs.date }}
        run: python relative_strength.py --date "$SCAN_DATE"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.ready.outputs.ready == 'true' }}
        with:
          name: shun-report-${{ steps.ready.outputs.date }}
          path: reports/${{ steps.ready.outputs.date }}/
          retention-days: 30
          if-no-files-found: error
